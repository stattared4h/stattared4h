name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks GitHub Action requires a paid licence for organisation-owned
      # repositories, so run the MIT-licensed CLI directly instead. The version is
      # pinned and the module checksum is verified through the Go checksum
      # database. --redact keeps any finding out of the log, which is public.
      - name: Run Gitleaks
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git \
            --redact \
            --verbose \
            --no-banner \
            .
