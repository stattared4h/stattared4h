name: Deploy till QA

# Runs after the Quality workflow has finished on main, and deploys only when it was
# green on that very commit (02-§9.11). A merge to main therefore reaches QA by itself,
# and production is rebuilt from the latest tag with main's content (02-§10.35).
#
# workflow_run always runs in the context of main and checks out main's head. The
# commit the Quality run tested is never checked out from the event: the deploy only
# proceeds when that commit IS main's head. If main has moved on, the newer commit's own
# Quality run triggers its own deploy, so nothing is lost.

on:
  workflow_run:
    workflows: ["Quality"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: Compute versions
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to look up which pull request the commit was merged from.
      pull-requests: read
    outputs:
      deploy: ${{ steps.head.outputs.deploy }}
      version: ${{ steps.versions.outputs.version }}
      qa_version: ${{ steps.versions.outputs.qa_version }}
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deploy only the commit Quality was green on (02-§9.11): that is main's head, or
      # this run stands down in favour of the newer commit's own run.
      - name: Confirm the tested commit is main's head
        id: head
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "${TESTED_SHA}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on since ${TESTED_SHA}; its newer commit deploys itself."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # QA's version is the latest tag vX.Y.* for the X.Y in VERSION, or X.Y.0 when the
      # series has no tag yet, followed by " – QA PR<n>" (02-§10.33). The pull request
      # number comes from the API because a rebase merge does not carry it in the
      # subject line; the short SHA is the fallback (03-§10.4).
      - name: Compute versions
        id: versions
        if: steps.head.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          xy="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "${xy}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must contain X.Y, found '${xy}'"
            exit 1
          fi

          # Highest tag vX.Y.P for a given X.Y (or for any X.Y with the pattern [0-9]+\.[0-9]+).
          latest_tag() {
            git tag --list 'v*' | { grep -E "^v$1\.[0-9]+$" || true; } | sort -V | tail -n 1
          }

          series_tag="$(latest_tag "${xy//./\\.}")"
          if [ -n "${series_tag}" ]; then
            version="${series_tag#v}"
          else
            version="${xy}.0"
          fi

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty' || true)"
          if [ -n "${pr}" ]; then
            suffix="PR${pr}"
          else
            suffix="$(git rev-parse --short "${SHA}")"
          fi
          qa_version="${version} – QA ${suffix}"

          {
            echo "version=${version}"
            echo "qa_version=${qa_version}"
          } >> "$GITHUB_OUTPUT"
          echo "QA ${qa_version}; production ${version} built from the latest release tag"

  deploy:
    name: Deploy
    needs: version
    if: needs.version.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time, shared with the production deploy, and never cancel one
    # that is mid-flight: an interrupted Pages deployment can leave the site half published.
    concurrency:
      group: pages
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.version }}
      qa_version: ${{ needs.version.outputs.qa_version }}
      # Production's code is the latest release; only a production deploy may put
      # unreleased code in the root (03-§8.9).
      production_from_latest_tag: true
